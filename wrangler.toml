# Cloudflare Pages project.
# Pages serves everything in public/ from the edge and runs functions/api/lead.js
# for POST /api/lead. Declaring the output directory here means there is nothing
# to configure in the dashboard.

name = "jet-cleaning"
compatibility_date = "2026-09-01"
pages_build_output_dir = "public"

# GHL_WEBHOOK_URL is a secret, not a var. Set it in:
# Workers & Pages > jet-cleaning > Settings > Variables and Secrets
